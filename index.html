<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you my wife</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            user-select: none;
        }

        #ui {
            position: relative;
            transform: scale(1.2); 
        }

        .love_wrapper {
            position: absolute;
            /* YENİLİK: Kelimenin sol üst köşesini değil, tam merkezini (0,0) noktası yapar */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 0;
            height: 0;
        }

        .love_word {
            color: #ea80b0;
            font-size: 0.8rem;
            font-weight: bold;
            /* YENİLİK: translate(-50%, -50%) ile yazıyı kendi genişliğinin yarısı kadar geriye çekerek tam ortalıyoruz */
            transform: translate(-50%, -50%) translateY(-100%) rotateZ(-30deg);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            white-space: nowrap;
            opacity: 0.9;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="ui"></div>

    <script>
        // Developed by Goopinator & Updated
        const ui = document.getElementById('ui');
        const totalElements = 150; 
        const scale = 14; 
        const elements = []; 

        const textList = [
            'I love you',
            'seni seviyorum',
            'karım',
            'kocam',
            'güzelim',
            'birtanem',
            'i miss you'
        ];
        let currentTextIndex = 0; 

        // 1. AŞAMA: Bütün kelimeleri oluşturup DOM'a ekliyoruz
        for (let i = 0; i < totalElements; i++) {
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'love_wrapper';

            const wordDiv = document.createElement('div');
            wordDiv.className = 'love_word';
            wordDiv.innerText = textList[currentTextIndex]; 

            wrapperDiv.appendChild(wordDiv);
            ui.appendChild(wrapperDiv);

            elements.push({ 
                element: wrapperDiv, 
                wordElement: wordDiv, 
                index: i 
            });
        }

        // TIKLAMA OLAYI
        document.body.addEventListener('click', () => {
            currentTextIndex = (currentTextIndex + 1) % textList.length;
            
            elements.forEach((item) => {
                item.wordElement.innerText = textList[currentTextIndex];
            });
        });

        let time = 0;

        // 2. AŞAMA: JavaScript ile sonsuz dönüş animasyonu
        function animateLoop() {
            time -= 0.005; 

            elements.forEach((item) => {
                const t = (item.index / totalElements) * Math.PI * 2 + time;
                
                // Kalp formu denklemi
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); 
                
                // Yeni koordinatları uygula
                item.element.style.left = `${x * scale}px`;
                item.element.style.top = `${y * scale}px`;
            });

            requestAnimationFrame(animateLoop);
        }

        // Animasyonu başlat
        animateLoop();
    </script>

</body>
</html>
